name: Release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.os }}-${{ matrix.arch }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - os: windows
                      arch: amd64
                      ext: .exe
                    - os: windows
                      arch: arm64
                      ext: .exe
                    - os: linux
                      arch: amd64
                      ext: ""
                    - os: linux
                      arch: arm64
                      ext: ""
                    - os: darwin
                      arch: amd64
                      ext: ""
                    - os: darwin
                      arch: arm64
                      ext: ""

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              id: build
              env:
                  GOOS: ${{ matrix.os }}
                  GOARCH: ${{ matrix.arch }}
                  CGO_ENABLED: 0
              run: |
                  VERSION="${{ github.ref_name }}"
                  VERSION_SAFE=$(echo "${VERSION}" | sed 's/[^a-zA-Z0-9]/-/g')
                  BIN="omnicast-live-${{ matrix.os }}-${{ matrix.arch }}-${VERSION_SAFE}${{ matrix.ext }}"
                  mkdir -p dist
                  go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${BIN}" .
                  echo "bin=${BIN}" >> "$GITHUB_OUTPUT"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.build.outputs.bin }}
                  path: dist/${{ steps.build.outputs.bin }}
                  retention-days: 7

            - name: Upload to release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/${{ steps.build.outputs.bin }}
