<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OmniCast — OBS Overlay</title>
  <style>
    /* OBS transparent background */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent !important;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ── Player portraits grid ─────────────────────────────────────── */
    #portraits-grid {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      padding: 0 8px 8px;
      gap: 8px;
    }

    .portrait {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all .4s ease;
      animation: popIn .4s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.7) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .portrait-img-wrap {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }
    .portrait img {
      display: block;
      border-radius: 8px;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,.15);
      transition: filter .4s, border-color .4s;
    }
    .portrait.dead img  { filter: grayscale(1) brightness(.6); border-color: #555; }
    .portrait.mute img  { border-color: #ce93d8; }
    .portrait.alive img { border-color: rgba(255,255,255,.15); }
    .portrait.winner img { border-color: #4caf50; box-shadow: 0 0 24px #4caf50; }

    .portrait-name {
      margin-top: 4px;
      font-size: .72em;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px #000, 0 0 8px #000;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .portrait-pts {
      font-size: .68em;
      color: #ffd700;
      text-shadow: 0 1px 4px #000;
      font-weight: 700;
    }
    .portrait-role {
      font-size: .65em;
      color: #ce93d8;
      text-shadow: 0 1px 4px #000;
      font-weight: 600;
      max-width: 100%;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .portrait-status-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: .6em;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .badge-dead { background: #263238; color: #90a4ae; }
    .badge-mute { background: #311b92; color: #ce93d8; }

    /* ── Buzzer winner banner ──────────────────────────────────────── */
    #buzzer-banner {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(76,175,80,.92);
      color: #fff;
      font-size: 1.8em;
      font-weight: 900;
      padding: .4em 1.2em;
      border-radius: 50px;
      text-align: center;
      pointer-events: none;
      display: none;
      animation: bounceIn .4s ease;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
      white-space: nowrap;
    }
    @keyframes bounceIn {
      0%   { transform: translateX(-50%) scale(.5); opacity: 0; }
      70%  { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    /* ── Vote results panel ──────────────────────────────────────── */
    #vote-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(13,13,26,.88);
      border: 1px solid rgba(233,69,96,.4);
      border-radius: 12px;
      padding: 14px 18px;
      min-width: 220px;
      display: none;
    }
    #vote-panel h3 {
      font-size: .85em;
      letter-spacing: .1em;
      color: #e94560;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .vote-result-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: .82em;
      color: #eee;
    }
    .vote-bar-wrap { flex: 1; background: rgba(255,255,255,.1); border-radius: 4px; height: 7px; overflow: hidden; }
    .vote-bar-fill { height: 100%; background: #e94560; border-radius: 4px; transition: width .6s ease; }

    /* ── Points delta animation ──────────────────────────────────── */
    .pts-delta {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .8em;
      font-weight: 900;
      pointer-events: none;
      animation: floatUp 1.8s ease forwards;
    }
    .pts-delta.pos { color: #4caf50; text-shadow: 0 0 8px #4caf50; }
    .pts-delta.neg { color: #f44336; text-shadow: 0 0 8px #f44336; }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
    }
  </style>
</head>
<body>
  <!-- Portraits grid -->
  <div id="portraits-grid"></div>

  <!-- Buzzer winner banner -->
  <div id="buzzer-banner" id="buzzer-banner">⚡ &nbsp; <span id="buzzer-winner-name"></span> &nbsp; BUZZED IN!</div>

  <!-- Vote results -->
  <div id="vote-panel">
    <h3>📊 Vote Results</h3>
    <div id="vote-results"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>
